<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">WattWise KLoad tracking concept</title>
  <desc id="desc">Concept showing KLoad rate setup, daily appliance usage estimate, and a separate monthly Meralco adjustment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effcf0"/><stop offset="1" stop-color="#e8f4ee"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173c2a" flood-opacity=".10"/></filter>
    <style>
      .title{font:700 34px Inter,Arial,sans-serif;fill:#173c2a}.sub{font:400 17px Inter,Arial,sans-serif;fill:#607468}
      .head{font:700 21px Inter,Arial,sans-serif;fill:#173c2a}.body{font:400 16px Inter,Arial,sans-serif;fill:#334a3c}
      .small{font:400 13px Inter,Arial,sans-serif;fill:#6b7e71}.label{font:600 13px Inter,Arial,sans-serif;fill:#52675a}
      .value{font:700 20px Inter,Arial,sans-serif;fill:#173c2a}.white{fill:#fff}
    </style>
  </defs>
  <rect width="1440" height="980" fill="url(#bg)"/>
  <text x="72" y="72" class="title">WattWise · KLoad tracking</text>
  <text x="72" y="105" class="sub">Concept flow: enter the rate from Meralco’s daily notice, then record appliance use.</text>

  <!-- Settings screen -->
  <g filter="url(#shadow)"><rect x="72" y="150" width="570" height="650" rx="28" fill="#fff"/></g>
  <rect x="72" y="150" width="570" height="84" rx="28" fill="#f8fbf8"/>
  <path d="M72 206h570v28H72z" fill="#f8fbf8"/>
  <circle cx="112" cy="192" r="22" fill="#e3f4e6"/><text x="105" y="200" style="font:700 21px Arial;fill:#277343">‹</text>
  <text x="151" y="190" class="head">Settings</text><text x="151" y="214" class="small">Rates and estimate preferences</text>
  <text x="108" y="278" class="head">Kuryente Load</text>
  <text x="108" y="307" class="body">Track appliance use against your prepaid rate.</text>
  <rect x="108" y="332" width="498" height="55" rx="14" fill="#f3f8f3"/>
  <text x="128" y="366" class="body">I use Kuryente Load</text><rect x="548" y="347" width="42" height="24" rx="12" fill="#32864d"/><circle cx="576" cy="359" r="9" fill="#fff"/>
  <text x="108" y="424" class="label">INITIAL RATE FROM DAILY NOTICE</text>
  <rect x="108" y="439" width="236" height="62" rx="12" fill="#fff" stroke="#c9d7cb"/>
  <text x="128" y="461" class="small">Rate</text><text x="128" y="487" class="value">₱12.00 / kWh</text>
  <rect x="358" y="439" width="248" height="62" rx="12" fill="#fff" stroke="#c9d7cb"/>
  <text x="378" y="461" class="small">Effective month</text><text x="378" y="487" class="value">November 2026</text>
  <text x="108" y="534" class="label">SOURCE</text>
  <rect x="108" y="548" width="498" height="54" rx="12" fill="#fff" stroke="#c9d7cb"/>
  <text x="128" y="582" class="body">KLoad daily balance notice</text>
  <rect x="108" y="620" width="498" height="66" rx="14" fill="#fff8e6"/>
  <text x="128" y="647" class="label" style="fill:#7f5c14">ESTIMATE ONLY</text>
  <text x="128" y="671" class="small">Meralco adjusts the rate after actual monthly use is known.</text>
  <rect x="108" y="712" width="498" height="54" rx="14" fill="#32864d"/>
  <text x="260" y="746" style="font:700 16px Arial;fill:white">Save rate for this month</text>

  <!-- flow arrow -->
  <path d="M661 475h70" stroke="#65a575" stroke-width="4" stroke-linecap="round"/><path d="m720 462 14 13-14 13" fill="none" stroke="#65a575" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dashboard screen -->
  <g filter="url(#shadow)"><rect x="760" y="150" width="608" height="650" rx="28" fill="#fff"/></g>
  <rect x="760" y="150" width="608" height="84" rx="28" fill="#f8fbf8"/>
  <path d="M760 206h608v28H760z" fill="#f8fbf8"/>
  <circle cx="801" cy="192" r="22" fill="#e3f4e6"/><text x="794" y="200" style="font:700 21px Arial;fill:#277343">ϟ</text>
  <text x="840" y="190" class="head">Dashboard</text><text x="840" y="214" class="small">November 2026 · Recorded usage</text>
  <rect x="794" y="258" width="540" height="126" rx="18" fill="#247346"/>
  <text x="824" y="292" style="font:600 14px Arial;fill:#d9f2df">USAGE SO FAR</text>
  <text x="824" y="333" style="font:700 30px Arial;fill:#fff">42.6 kWh</text>
  <path d="M1062 280v78" stroke="#78b88a"/>
  <text x="1090" y="292" style="font:600 14px Arial;fill:#d9f2df">ESTIMATED COST</text>
  <text x="1090" y="333" style="font:700 28px Arial;fill:#fff">₱511.20</text>
  <text x="1090" y="358" style="font:400 12px Arial;fill:#d9f2df">42.6 kWh × ₱12.00</text>
  <rect x="794" y="403" width="540" height="66" rx="14" fill="#fff8e6"/>
  <text x="816" y="430" class="label" style="fill:#7f5c14">KLOAD RATE ESTIMATE</text>
  <text x="816" y="452" class="small">Uses the initial rate entered from your notice.</text>
  <text x="794" y="510" class="head">Monthly KLoad adjustment</text>
  <rect x="794" y="526" width="540" height="102" rx="16" fill="#f3f8f3"/>
  <text x="818" y="557" class="label">Meralco adjustment from notice</text>
  <text x="818" y="593" class="value">−₱60.00 credit</text>
  <text x="1088" y="563" class="small">Applied separately</text><text x="1088" y="585" class="small">to household balance</text>
  <text x="794" y="668" class="small">The adjustment is not split across individual appliances.</text>
  <rect x="794" y="696" width="540" height="70" rx="14" fill="#fff" stroke="#c9d7cb"/>
  <text x="818" y="725" class="label">Add monthly adjustment</text><text x="818" y="748" class="small">Enter the peso credit or debit from Meralco’s notice</text>
  <text x="1284" y="740" style="font:700 24px Arial;fill:#32864d">＋</text>

  <!-- footnote / flow -->
  <rect x="72" y="834" width="1296" height="94" rx="20" fill="#173c2a"/>
  <circle cx="120" cy="881" r="22" fill="#b9e4c3"/><text x="113" y="888" style="font:700 20px Arial;fill:#173c2a">1</text>
  <text x="158" y="875" style="font:700 16px Arial;fill:#fff">Enter daily rate</text><text x="158" y="901" style="font:400 13px Arial;fill:#cfe4d4">Save source and effective month</text>
  <path d="M466 881h72" stroke="#83bf91" stroke-width="3"/><path d="m527 872 10 9-10 9" fill="none" stroke="#83bf91" stroke-width="3"/>
  <circle cx="586" cy="881" r="22" fill="#b9e4c3"/><text x="579" y="888" style="font:700 20px Arial;fill:#173c2a">2</text>
  <text x="624" y="875" style="font:700 16px Arial;fill:#fff">Log appliances</text><text x="624" y="901" style="font:400 13px Arial;fill:#cfe4d4">Hours × wattage → estimated kWh and cost</text>
  <path d="M944 881h72" stroke="#83bf91" stroke-width="3"/><path d="m1005 872 10 9-10 9" fill="none" stroke="#83bf91" stroke-width="3"/>
  <circle cx="1064" cy="881" r="22" fill="#b9e4c3"/><text x="1057" y="888" style="font:700 20px Arial;fill:#173c2a">3</text>
  <text x="1102" y="875" style="font:700 16px Arial;fill:#fff">Record adjustment</text><text x="1102" y="901" style="font:400 13px Arial;fill:#cfe4d4">Keep Meralco’s monthly credit/debit separate</text>
</svg>
