name: wattwise
description: Electricity monitoring, bill explanations, and Mira assistance.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.0.0
  firebase_app_check: ^0.5.1
  cloud_firestore: ^7.0.0
  firebase_ai: ^5.1.0
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_svg: ^2.2.0
  file_picker: ^13.3.3
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7
flutter:
  uses-material-design: true
  assets:
    - assets/figma/
    - assets/data/appliance_catalog.json
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf


